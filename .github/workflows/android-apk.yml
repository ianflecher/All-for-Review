name: Build Android APK

# This PC cannot build an APK: the Android SDK only comes from dl.google.com.
# GitHub's runners ship the SDK and NDK already, so the build happens here and
# the APK is attached to the run as a downloadable artifact.
on:
  push:
    branches:
      - main
      - claude/android-reviewer-fix-jf1sla
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Needed to attach the APK to a release.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: PDFReviewerApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PDFReviewerApp/package-lock.json

      # Expo SDK 55 / AGP 8 want a JDK in the 17-21 range; the runner default
      # is newer than the Android build tools accept.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Cheap and fast, and they run before the seven-minute Gradle step so a
      # broken change fails in under a minute rather than at the end.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Android decides what counts as an upgrade from versionCode alone. Left
      # at 1, every build looks like the same version and installing over an
      # existing copy can be refused, forcing an uninstall that wipes the
      # user's data. The run number always increases, so updates install
      # cleanly over the top.
      - name: Stamp the build number
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
            console.log('versionCode =', config.expo.android.versionCode);
          "

      - name: Generate the native Android project
        run: npx expo prebuild -p android --no-install

      - name: Build the APK
        working-directory: PDFReviewerApp/android
        # Only the two ARM ABIs real phones use — x86/x86_64 are emulator-only
        # and would roughly double the download for nothing.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: IDF-Reviewer-apk
          path: PDFReviewerApp/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Run artifacts download as a .zip and need a logged-in GitHub session,
      # which is awkward on a phone. A release asset is a direct .apk link that
      # can just be tapped. The tag is fixed, so the link never changes.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk IDF-Reviewer.apk
          gh release create android-latest \
            --title "IDF Reviewer — Android APK" \
            --notes "Latest Android build of the reviewer, straight from CI.

          **[Download IDF-Reviewer.apk](https://github.com/${{ github.repository }}/releases/download/android-latest/IDF-Reviewer.apk)**

          Tap it on your phone to install. Android will warn that it comes from an unknown source — allow \"Install unknown apps\" for your browser and continue.

          Signed with the standard Android debug key, so if you already have a copy installed from a different build, uninstall it first." \
            || echo "Release already exists — updating the asset."
          gh release upload android-latest IDF-Reviewer.apk --clobber
